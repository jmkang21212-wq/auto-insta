<!doctype html>
<html><head><meta charset="utf-8">
<style>
/*FONTS*/
:root{--bg:#0B0D12;--ink:#F2F4F6;--mute:#AEB6C1;--dim:#8B95A1;--blue:#5EA9FF;--blue2:#2F6FDB;--gold:#F5C84B;--line:#2A2F3A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:P,sans-serif;color:var(--ink);letter-spacing:-0.02em;word-break:keep-all}
.full{position:absolute;inset:0}
.bgimg{position:absolute;left:-54px;top:-96px;width:1188px;height:2112px;object-fit:cover;will-change:transform,opacity}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.abs{position:absolute}
.c{left:60px;right:60px;text-align:center}
.lab{font-weight:700;font-size:42px;color:var(--mute)}
.num{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.gold{color:var(--gold)} .blue{color:var(--blue)}
.shadow{text-shadow:0 6px 30px rgba(0,0,0,.65)}
.bar{height:34px;border-radius:17px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%}
.ptag{position:absolute;padding:12px 24px;border-radius:16px;font-weight:800;font-size:36px;background:rgba(11,13,18,.8);border:2px solid rgba(94,169,255,.55);color:#DCEBFF;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rrow{display:flex;align-items:center;gap:22px;padding:22px 30px;margin-bottom:18px;border-radius:24px;background:rgba(11,13,18,.72);border:2px solid rgba(255,255,255,.14);opacity:0}
.rrow .ic{font-size:52px}.rrow .lb{flex:1;font-weight:700;font-size:36px;color:var(--mute)}.rrow .vl{font-weight:900;font-size:56px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:16px 30px;border-radius:20px;background:rgba(11,13,18,.62);border:2px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
#top{position:absolute;left:0;right:0;top:288px;text-align:center}
#top span{display:inline-block;padding:12px 28px;border-radius:999px;font-weight:700;font-size:32px;background:rgba(94,169,255,.16);color:var(--blue);border:2px solid rgba(94,169,255,.4)}
#cap{position:absolute;left:70px;right:70px;top:1388px;text-align:center;font-weight:800;font-size:52px;line-height:1.32}
#cap span{text-shadow:0 4px 18px rgba(0,0,0,.85)}
#src{position:absolute;left:0;right:0;top:1552px;text-align:center;font-size:25px;color:rgba(200,206,214,.55);font-weight:500}
#hookTitle b{color:var(--gold);font-weight:900}
</style></head>
<body>
<canvas id="grid" class="full" width="1080" height="1920"></canvas>
<img id="bgClip" class="bgimg" style="left:0;top:0;width:1080px;height:1920px;opacity:0">
<img id="bgHero" class="bgimg" style="opacity:0">
<img id="bgBack" class="bgimg" style="opacity:0">
<div class="full" id="shade" style="background:linear-gradient(180deg,rgba(11,13,18,.82) 0%,rgba(11,13,18,.15) 30%,rgba(11,13,18,.25) 62%,rgba(11,13,18,.92) 100%)"></div>
<div id="top"><span>ipov · 공모주</span></div>

<div class="scene" id="s-intro">
  <div class="abs c shadow" id="hookTitle" style="top:380px;font-weight:900;font-size:84px;line-height:1.16"></div>
  <div class="abs c" id="logoWrap" style="top:372px;opacity:0">
    <div id="logoBox" style="display:inline-flex;align-items:center;border-radius:24px;padding:18px 36px;box-shadow:0 20px 60px rgba(0,0,0,.45)"><img id="logoImg" style="height:70px"></div>
    <div id="corpName" class="shadow" style="font-weight:900;font-size:60px"></div>
    <div id="aboutMeta" class="lab shadow" style="margin-top:12px;font-size:32px"></div>
  </div>
  <svg id="introSvg" class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
    <path id="arrow" d="" fill="none" stroke="#F5C84B" stroke-width="8" stroke-linecap="round"/>
    <path id="arrowHead" d="" fill="#F5C84B"/>
    <g id="partLines"></g>
    <line id="strike" stroke="#FF5A5A" stroke-width="12" stroke-linecap="round"/>
  </svg>
  <div class="abs" id="emojiBox" style="left:540px;top:880px"><div id="hookEmoji" style="font-size:250px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))"></div></div>
  <div class="abs" id="sticker" style="left:760px;top:1060px;opacity:0"><div id="stickerIn" style="transform:translate(-50%,-50%) rotate(8deg)"><span id="stickerTxt" style="display:inline-block;white-space:nowrap;background:#fff;color:#111;padding:12px 26px;border-radius:14px;font-weight:800;font-size:40px;box-shadow:0 12px 30px rgba(0,0,0,.45)"></span></div></div>
  <div class="abs" id="stamp" style="left:540px;top:1200px;opacity:0">
    <div id="stampIn" style="transform:translate(-50%,-50%)"><span id="stampTxt" style="display:inline-block;white-space:nowrap;background:var(--gold);color:#111;padding:18px 40px;border-radius:20px;font-weight:900;font-size:58px;box-shadow:0 16px 40px rgba(0,0,0,.45)"></span></div>
  </div>
  <div class="abs" id="termBox" style="left:540px;top:930px;opacity:0"><div id="termIn" style="transform:translate(-50%,-50%);text-align:center">
    <div style="font-weight:700;font-size:30px;color:var(--mute);margin-bottom:10px" class="shadow">실제로는</div>
    <span id="termTxt" style="display:inline-block;white-space:nowrap;background:rgba(11,13,18,.78);border:4px solid var(--gold);color:var(--ink);padding:22px 44px;border-radius:26px;font-weight:900;font-size:66px;box-shadow:0 20px 60px rgba(0,0,0,.5)"></span></div></div>
  <div id="partTags"></div>
  <div class="abs c shadow" id="aboutLines" style="top:1150px;font-weight:800;font-size:46px;line-height:1.28;opacity:0"></div>
  <div class="abs c shadow" id="defineBox" style="top:820px;opacity:0;font-weight:800;font-size:58px;line-height:1.38"></div>
  <div class="abs c" id="explainWrap" style="top:1262px;opacity:0"><span class="chip" id="aboutExplain" style="font-weight:600;font-size:30px;color:var(--mute)"></span></div>
</div>

<div class="scene" id="s-value">
  <div class="abs" style="left:110px;right:110px;top:470px">
    <div class="lab shadow" id="v1lab">확정 공모가</div>
    <div class="num shadow" style="font-size:124px;margin-top:6px" id="v1">0원</div>
    <div class="bar" style="background:rgba(42,47,58,.9);margin-top:18px"><div class="bar" id="vb1" style="width:0;background:#B0B8C1"></div></div>
    <div style="height:110px"></div>
    <div class="lab shadow" id="v2lab">주관사가 계산한 <span class="blue">주당 몸값</span></div>
    <div class="num blue shadow" style="font-size:150px;margin-top:6px" id="v2">0원</div>
    <div class="bar" id="vb2w" style="background:rgba(42,47,58,.9);margin-top:18px"><div class="bar" id="vb2" style="width:0;background:linear-gradient(90deg,var(--blue2),var(--blue))"></div></div>
    <div class="shadow" style="margin-top:34px;font-size:30px;color:var(--mute);font-weight:600" id="vnote"></div>
  </div>
</div>

<div class="scene" id="s-demand">
  <div class="abs c lab shadow" style="top:450px">기관 수요예측 경쟁률</div>
  <div class="abs c num shadow" style="top:510px;font-size:170px" id="dr">0 : 1</div>
  <div id="dots" class="abs" style="left:150px;top:790px;width:780px;height:520px"></div>
</div>

<div class="scene" id="s-ring">
  <div class="abs c lab shadow" style="top:450px" id="ringLab"></div>
  <svg class="abs" style="left:240px;top:560px" width="600" height="600" viewBox="0 0 600 600">
    <circle cx="300" cy="300" r="230" fill="none" stroke="rgba(42,47,58,.92)" stroke-width="64"/>
    <circle id="arc" cx="300" cy="300" r="230" fill="none" stroke="#F5C84B" stroke-width="64" transform="rotate(-90 300 300)" stroke-dasharray="0 2000"/>
  </svg>
  <div class="abs c num gold shadow" style="top:770px;font-size:150px" id="ringPct">0%</div>
  <div class="abs c shadow" style="top:1215px;font-size:34px;color:var(--mute);font-weight:600" id="ringNote"></div>
</div>

<div class="scene" id="s-sched">
  <div class="abs c lab shadow" style="top:520px">청약 일정</div>
  <div class="abs c num shadow" style="top:600px;font-size:150px" id="schedBig"></div>
  <div class="abs c shadow" style="top:840px;font-size:40px;color:var(--mute);font-weight:700" id="schedSub"></div>
</div>

<div class="scene" id="s-end">
  <div class="abs c lab shadow" id="recapLab" style="top:440px">정리하면</div>
  <div class="abs" id="recapRows" style="left:110px;right:110px;top:520px"></div>
  <div class="abs c" id="askBox" style="top:1000px;opacity:0">
    <div id="askIcon" style="font-size:110px;line-height:1">💬</div>
    <div id="askTxt" class="shadow" style="margin-top:18px;font-weight:900;font-size:62px;line-height:1.24"></div>
    <div style="margin-top:18px;font-weight:700;font-size:34px;color:var(--mute)">댓글로 알려 주세요 👇 · 자세한 숫자는 캡션에</div>
  </div>
</div>

<div id="sweep" class="full" style="opacity:0;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(94,169,255,.35) 45%,rgba(255,255,255,.75) 50%,rgba(245,200,75,.35) 55%,rgba(255,255,255,0) 65%);mix-blend-mode:screen;pointer-events:none"></div>
<div id="flash" class="full" style="opacity:0;background:#fff;pointer-events:none"></div>
<div id="cap"></div>
<div id="src"></div>

<script>
const D=__DATA__;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const $=id=>document.getElementById(id);
const sc=Object.fromEntries(D.scenes.map(s=>[s.scene,s]));
const XF=0.8;

// 배경 격자 (사진이 없을 때 대비)
const g=$('grid').getContext('2d');
function grid(t){g.fillStyle='#0B0D12';g.fillRect(0,0,1080,1920);
  const gx=540+Math.sin(t*.5)*220,gy=820+Math.cos(t*.37)*160;let r=g.createRadialGradient(gx,gy,0,gx,gy,900);
  r.addColorStop(0,'rgba(47,111,219,.28)');r.addColorStop(1,'rgba(47,111,219,0)');g.fillStyle=r;g.fillRect(0,0,1080,1920);
  g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=2;const o=(t*18)%90;
  for(let x=-90+o;x<1080;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x,1920);g.stroke()}
  for(let y=-90+o;y<1920;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(1080,y);g.stroke()}}

// 정적 내용 채우기
$('hookEmoji').textContent=D.hook.emoji||'';
$('hookTitle').innerHTML=D.hook.title;
$('stampTxt').textContent=D.hook.stamp;
$('stickerTxt').textContent=D.hook.sub||'';if(!D.hook.sub)$('sticker').style.display='none';
$('termTxt').textContent=D.hook.term||D.about.corp;
if(D.logo){$('logoImg').src=D.logo;$('logoBox').style.background=D.logoTone==='light'?'rgba(255,255,255,.08)':'#fff';
  if(D.logoTone==='light')$('logoBox').style.border='2px solid rgba(255,255,255,.18)';$('corpName').style.display='none'}else{$('logoBox').style.display='none'}
$('corpName').textContent=D.about.corp;
$('aboutMeta').textContent=D.about.meta;
$('askTxt').textContent='';
const rows=(D.recap||[]).map(r=>{const d=document.createElement('div');d.className='rrow';
  d.innerHTML=`<span class="ic">${r.icon}</span><span class="lb">${r.label}</span><span class="vl">${r.value}</span>`;$('recapRows').appendChild(d);return {el:d,value:r.value,label:r.label}});
if(sc.ask){const ws=D.caps.filter(c=>c.s>=sc.ask.t0-0.05&&c.s<sc.ask.t1).map(c=>c.d);const i=ws.findIndex(w=>w.startsWith('댓글로'));
  $('askTxt').innerHTML=(i>0?ws.slice(0,i):ws).join(' ').split(/(?<=,)\s/).join('<br>');}
const PARTS=(D.hook.parts||[]).slice(0,5);
const defWords=[];if(sc.define){const box=$('defineBox');const ws=D.caps.filter(c=>c.s>=sc.define.t0-0.05&&c.s<sc.define.t1);
  ws.forEach((w,i)=>{const sp=document.createElement('span');sp.style.display='inline-block';sp.style.marginRight='0.28em';
    const txt=w.d.replace(/[.,]$/,'');sp.textContent=txt;if(i===0||txt.startsWith(D.hook.term))sp.style.color='#F5C84B';box.appendChild(sp);defWords.push({el:sp,s:w.s})});}
$('aboutLines').innerHTML=PARTS.length?'':D.about.lines.join('<br>');
if(D.about.explain){$('aboutExplain').textContent=D.about.explain}else{$('explainWrap').style.display='none'}
// 제품 둘레 낱말: 오른쪽 위부터 시계 방향 (왼쪽 위는 비유 이모지 자리)
const TC={x:540,y:930}, ANG=[-25,25,90,155,205].slice(0,Math.max(PARTS.length,0));
const ANGS=PARTS.length<=3?[-20,90,200].slice(0,PARTS.length):PARTS.length==4?[-25,40,140,205]:[-25,25,90,155,205];
const partEls=PARTS.map((w,i)=>{const a=ANGS[i]*Math.PI/180,x=TC.x+Math.cos(a)*330,y=TC.y+Math.sin(a)*235;
  const d=document.createElement('div');d.className='ptag';d.textContent=w;d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=0;$('partTags').appendChild(d);
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',TC.x);l.setAttribute('y1',TC.y);l.setAttribute('x2',x);l.setAttribute('y2',y);
  l.setAttribute('stroke','rgba(94,169,255,.6)');l.setAttribute('stroke-width','4');const len=Math.hypot(x-TC.x,y-TC.y);l.setAttribute('stroke-dasharray',`${len} ${len}`);l.setAttribute('stroke-dashoffset',len);
  $('partLines').appendChild(l);return {d,l,len}});
$('src').textContent=D.source;
const V=D.value, hasPrice=!!V.price, vtop=Math.max(V.val||0,V.price||V.high||0)||1;
$('v1lab').textContent=hasPrice?'확정 공모가':'희망 공모가';
const v1End=hasPrice?V.price:V.high;
if(V.model&&V.mult)$('vnote').textContent=`비슷한 상장사 ${V.model} ${V.mult}배로 계산 · 신고서는 상장 뒤 적정주가가 아니라고 밝힘`;
else $('vnote').textContent='신고서는 이 값이 상장 뒤 적정주가가 아니라고 밝힘';
// 경쟁률 점
const dots=[];{const box=$('dots');for(let i=0;i<285;i++){const d=document.createElement('div');d.className='dot';
  d.style.left=((i%19)*41)+'px';d.style.top=(Math.floor(i/19)*34)+'px';d.style.background=i==0?'#F5C84B':'#5EA9FF';box.appendChild(d);dots.push(d)}}
// 도넛: 확약 또는 유통
const ring=sc.lockup?{pct:D.demand.lock,lab:'상장 뒤 <span class="gold">안 팔겠다고 약속한</span> 기관 물량',note:`나머지 ${String(parseFloat((100-D.demand.lock).toFixed(2)))}%는 확약 없음`,s:sc.lockup}
          :sc.float?{pct:D.float.pct,lab:'상장 첫날 <span class="blue">팔 수 있는</span> 물량',note:'',s:sc.float}:null;
if(ring){$('ringLab').innerHTML=ring.lab;$('ringNote').textContent=ring.note;if(sc.float&&!sc.lockup){$('arc').setAttribute('stroke','#5EA9FF');$('ringPct').classList.remove('gold');$('ringPct').classList.add('blue')}}
if(D.sched.s){const f=s=>`${+s.slice(5,7)}.${s.slice(8,10)}`;$('schedBig').textContent=`${f(D.sched.s)}~${f(D.sched.e).split('.')[1]}`;$('schedSub').textContent=D.hook.stamp}
const IMG={hero:D.img.hero,back:D.img.back};
if(IMG.hero)$('bgHero').src=IMG.hero;if(IMG.back)$('bgBack').src=IMG.back;

// 자막 덩어리
const chunks=[];{let cur=[],len=0;for(const w of D.caps){cur.push(w);len+=w.d.length+1;
  if(/[.,]$/.test(w.d)||len>=15){chunks.push(cur);cur=[];len=0}}if(cur.length)chunks.push(cur)}

function capT(sub,s){for(const c of D.caps){if(c.d.includes(sub)&&c.s>=s.t0-0.05&&c.s<=s.t1)return c}return null}
function trans(id,s,t){const el=$(id);if(!s){el.style.opacity=0;return}
  const e=eo(prog(t,s.t0-XF/2,s.t0+XF/2)),x=eio(prog(t,s.t1-XF/2,s.t1+XF/2));const first=s.t0<=0.01;
  const ee=first?1:e;el.style.opacity=ee*(1-x);
  el.style.transform=`translateY(${(1-ee)*90-x*60}px) scale(${1+0.14*(1-ee)-0.1*x}) rotate(${(1-ee)*-1.5+x*1.5}deg)`;
  const b=(1-ee)*16+x*16;el.style.filter=b>0.3?`blur(${b.toFixed(1)}px)`:'none';}
const BOUNDS=D.scenes.slice(1).map(s=>s.t0).filter(b=>!(sc.about&&Math.abs(b-sc.about.t0)<0.01)&&!(sc.define&&Math.abs(b-sc.define.t0)<0.01));
function sweep(t){let best=null;for(const b of BOUNDS){if(Math.abs(t-b)<0.6)best=b}
  if(best===null){$('sweep').style.opacity=0;$('flash').style.opacity=0;return}
  const p=prog(t,best-0.55,best+0.55);$('sweep').style.opacity=Math.sin(Math.PI*p);$('sweep').style.transform=`translateX(${lerp(-1300,1300,eio(p))}px)`;
  $('flash').style.opacity=0.22*Math.max(0,1-Math.abs(t-best)/0.12);}
function vis(s,t){if(!s)return 0;return prog(t,s.t0-XF/2,s.t0+XF/2)*(1-prog(t,s.t1-XF/2,s.t1+XF/2))}
function local(s,t){return t-s.t0}

async function setT(t){
  grid(t);
  const H=sc.hook,A=sc.about,DF=sc.define,aT=A?A.t0:H.t1,dT=DF?DF.t0:1e9;
  const intro={t0:H.t0,t1:(DF||A||H).t1};const iv=vis(intro,t);
  // 배경: 소개(훅+사업) = 1장 사진(정지, 천천히 확대) → 숫자 장면 = 흐린 사진
  $('bgHero').style.opacity=IMG.hero?iv:0;
  $('bgHero').style.transform=`scale(${1.0+0.07*prog(t,0,intro.t1)})`;
  $('bgBack').style.opacity=IMG.back?clamp(1-iv):0;
  let punch=0;for(const bb of BOUNDS){punch=Math.max(punch,Math.max(0,1-Math.abs(t-bb)/0.5))}
  $('bgBack').style.transform=`scale(${1.02+0.06*prog(t,0,D.total)+0.05*eo(punch)}) translateX(${lerp(-24,24,prog(t,0,D.total))}px)`;
  $('shade').style.opacity=0.85+0.15*iv;
  trans('s-intro',intro,t);
  sweep(t);
  {const r=eio(prog(t,aT,aT+0.7));                       // 비유 → 실제 전환
   const tin=eo(prog(t,0.15,0.55)),tout=eo(prog(t,aT-0.1,aT+0.3));
   $('hookTitle').style.opacity=tin*(1-tout);$('hookTitle').style.transform=`translateY(${(1-tin)*50-tout*40}px)`;
   const pop=back(prog(t,0.05,0.6));
   const ex=lerp(540,190,r),ey=lerp(880,640,r),es=lerp(1,0.42,r)*pop;
   $('emojiBox').style.left=ex+'px';$('emojiBox').style.top=ey+'px';
   $('hookEmoji').style.transform=`translate(-50%,-50%) scale(${es}) rotate(${(1-r)*Math.sin(t*3.2)*5}deg)`;
   $('hookEmoji').style.opacity=1-0.45*prog(t,aT+0.8,aT+1.2);
   const sk=prog(t,Math.min(1.2,H.t1*0.4),Math.min(1.5,H.t1*0.4+0.3));
   $('sticker').style.opacity=clamp(sk*3)*(1-prog(t,aT-0.1,aT+0.2));$('stickerIn').style.transform=`translate(-50%,-50%) rotate(${lerp(-10,8,back(sk))}deg) scale(${lerp(1.6,1,eo(sk))})`;
   const st=prog(t,Math.min(1.9,H.t1*0.6),Math.min(2.25,H.t1*0.6+0.35));
   $('stamp').style.opacity=clamp(st*3)*(1-prog(t,aT-0.1,aT+0.2));$('stampIn').style.transform=`translate(-50%,-50%) rotate(${lerp(-14,-4,back(st))}deg) scale(${lerp(1.8,1,eo(st))})`;
   // 작아진 이모지에 빗금 (진짜 그것 아님)
   const sx=prog(t,aT+0.75,aT+1.0);const S=$('strike');S.setAttribute('x1',ex-70);S.setAttribute('y1',ey-70);
   S.setAttribute('x2',lerp(ex-70,ex+70,sx));S.setAttribute('y2',lerp(ey-70,ey+70,sx));S.style.opacity=sx>0?1:0;
   // 화살표: 이모지 → 실제 제품
   const ap=prog(t,aT+0.7,aT+1.15);const x0=260,y0=700,x1=405,y1=880;
   $('arrow').setAttribute('d',`M${x0},${y0} Q${x0+20},${y1} ${lerp(x0,x1,ap)},${lerp(y0,y1,ap*ap)}`);$('arrow').style.opacity=ap>0?1:0;
   $('arrowHead').setAttribute('d',ap>=1?`M${x1+14},${y1} L${x1-12},${y1-16} L${x1-6},${y1+2} L${x1-12},${y1+18} Z`:'');
   const tp=prog(t,aT+0.95,aT+1.45);$('termBox').style.opacity=clamp(tp*2);$('termIn').style.transform=`translate(-50%,-50%) scale(${0.5+0.5*back(tp)})`;
   partEls.forEach((p,i)=>{const a0=aT+1.5+i*0.28;const lp=eio(prog(t,a0,a0+0.35)),pp=prog(t,a0+0.2,a0+0.55);
     p.l.setAttribute('stroke-dashoffset',p.len*(1-lp));p.d.style.opacity=clamp(pp*2);p.d.style.transform=`translate(-50%,-50%) scale(${0.4+0.6*back(pp)})`});
   const lg=back(prog(t,aT+0.2,aT+0.65));$('logoWrap').style.opacity=clamp(prog(t,aT+0.2,aT+0.45));$('logoWrap').style.transform=`translateY(${(1-lg)*-40}px)`;
   const al=eo(prog(t,aT+1.5,aT+1.9));$('aboutLines').style.opacity=al*(1-prog(t,dT-0.3,dT+0.2));
   // 정의: 둘레 낱말·화살표·이모지가 물러나고 제품 상자가 위로, 정의 문장이 말에 맞춰 밝아짐
   const dr=eio(prog(t,dT-0.1,dT+0.7)),dout=1-prog(t,dT-0.3,dT+0.3);
   partEls.forEach(p=>{p.d.style.opacity=parseFloat(p.d.style.opacity||0)*dout;p.l.style.opacity=dout});
   $('arrow').style.opacity=parseFloat($('arrow').style.opacity||0)*dout;$('arrowHead').style.opacity=dout;$('strike').style.opacity=parseFloat($('strike').style.opacity||0)*dout;
   $('hookEmoji').style.opacity=parseFloat($('hookEmoji').style.opacity||1)*dout;
   $('termBox').style.top=lerp(930,660,dr)+'px';$('termIn').style.transform+=` scale(${1-0.1*dr})`;
   if(DF){$('defineBox').style.opacity=eo(prog(t,dT+0.2,dT+0.6));
     defWords.forEach(w=>{const on=prog(t,w.s-0.08,w.s+0.12);w.el.style.opacity=0.22+0.78*on;w.el.style.transform=`translateY(${(1-eo(on))*10}px)`});}
   const xp=DF?0:eo(prog(t,aT+1.6+PARTS.length*0.28,aT+2.0+PARTS.length*0.28));$('explainWrap').style.opacity=xp;$('explainWrap').style.transform=`translateY(${(1-xp)*30}px)`;}
  // 3. 몸값
  if(sc.value){const s=sc.value,u=local(s,t),v=vis(s,t);trans('s-value',s,t);
    const d1=s.t1-s.t0;const k1=capT(fmt(v1End)+'원',s);const c1=k1?eio(prog(t,Math.min(k1.s-0.25,s.t0+0.15),k1.s+0.6)):eio(prog(u,0.15,Math.min(1.4,d1*0.3)));
    $('v1').textContent=hasPrice?fmt(V.price*c1)+'원':`${fmt(V.low*c1)}~${fmt(V.high*c1)}원`;$('vb1').style.width=(100*v1End/vtop*c1)+'%';
    const k2a=capT('몸값',s);const r2=k2a?eo(prog(t,k2a.s-0.5,k2a.s-0.15)):eo(prog(u,d1*0.33,d1*0.33+0.35));['v2lab','v2','vb2w'].forEach(id=>$(id).style.opacity=r2);
    const k2=capT(fmt(V.val)+'원',s);const c2=k2?eio(prog(t,k2.s-0.2,k2.s+0.7)):eio(prog(u,d1*0.55,d1*0.85));$('v2').textContent=fmt(lerp(v1End,V.val,c2))+'원';$('vb2').style.width=lerp(100*v1End/vtop,100*V.val/vtop,c2)+'%';
    $('vnote').style.opacity=k2?eo(prog(t,k2.s+0.8,k2.s+1.2)):eo(prog(u,d1*0.85,d1*0.85+0.4));}
  // 4. 경쟁률
  if(sc.demand){const s=sc.demand,u=local(s,t),v=vis(s,t);trans('s-demand',s,t);const d=s.t1-s.t0;
    const kd=capT(':1',s);const c=kd?eio(prog(t,kd.s-0.3,kd.s+0.7)):eio(prog(u,0.6,Math.max(1.2,d-0.6)));$('dr').innerHTML=`${String(parseFloat((D.demand.ratio*c).toFixed(2)))}<span style="color:#8B95A1"> : </span>1`;
    dots.forEach((el,i)=>{const at=(kd?kd.s-0.3-s.t0:0.6)+(i/285)*1.0;const x=prog(u,at,at+0.18);el.style.opacity=x;el.style.transform=`scale(${back(x)})`});}
  // 5. 도넛
  if(ring){const s=ring.s,u=local(s,t),v=vis(s,t);trans('s-ring',s,t);
    const d=s.t1-s.t0;const L=2*Math.PI*230;const kr=capT('%',s)||capT('퍼센트',s);const k=kr?eio(prog(t,kr.s-0.3,kr.s+0.8)):eio(prog(u,d*0.45,d*0.85));
    $('arc').setAttribute('stroke-dasharray',`${L*ring.pct/100*k} ${L}`);$('ringPct').textContent=String(parseFloat((ring.pct*k).toFixed(2)))+'%';
    $('ringNote').style.opacity=kr?eo(prog(t,kr.s+0.9,kr.s+1.3)):eo(prog(u,d*0.85,d*0.85+0.35));}
  // 6. 일정
  if(sc.sched){const s=sc.sched,u=local(s,t),v=vis(s,t);trans('s-sched',s,t);$('schedBig').style.transform=`scale(${0.85+0.15*back(prog(u,0,0.5))})`}
  // 7. 마무리
  {const R=sc.recap,K=sc.ask;const end=R||K?{t0:(R||K).t0,t1:(K||R).t1}:null;trans('s-end',end,t);
   if(end){rows.forEach((r,i)=>{const k=capT(r.value,R||K);const lb=D.caps.find(c=>R&&c.s>=R.t0&&c.s<R.t1&&r.label.startsWith(c.d.replace(/[,.]$/,'')));const at=lb?lb.s-0.15:(k?k.s-0.6:end.t0+0.4+i*0.5);const p=prog(t,at,at+0.4);
       r.el.style.opacity=clamp(p*2);r.el.style.transform=`translateX(${(1-eo(p))*-60}px)`;r.el.style.borderColor=(k&&t>=k.s&&t<=k.e+0.3)?'rgba(245,200,75,.8)':'rgba(255,255,255,.14)'});
     $('recapLab').style.opacity=R?eo(prog(t,end.t0,end.t0+0.4)):0;
     if(K){const q=prog(t,K.t0-0.1,K.t0+0.5);$('askBox').style.opacity=clamp(q*2);$('askBox').style.transform=`translateY(${(1-eo(q))*50}px) scale(${0.9+0.1*back(q)})`;
       $('askIcon').style.transform=`translateY(${Math.sin(t*5)*8}px) rotate(${Math.sin(t*3)*6}deg)`;
       const ry=R?0:-200;$('recapRows').style.transform=`translateY(${ry}px)`;}}}

  // 자막
  let cur=null;for(const ch of chunks){if(t>=ch[0].s-0.05&&t<=ch[ch.length-1].e+0.25)cur=ch}
  if(cur&&sc.define&&cur[0].s>=sc.define.t0-0.05&&cur[0].s<sc.define.t1)cur=null;
  if(cur&&sc.ask&&cur[0].s>=sc.ask.t0-0.05)cur=null;
  $('cap').innerHTML=cur?cur.map(w=>`<span style="color:${t>=w.s?'#F2F4F6':'rgba(242,244,246,.4)'}">${w.d.replace(/[,.]$/,'')}</span>`).join(' '):'';
}
window.setT=setT;
Promise.all([...document.images].filter(i=>i.src).map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>{window.ready=true});
</script>
