name: probe edgar
# 미국 IPO 파이프라인 설계 전 확인용: 깃허브 러너에서 SEC EDGAR 가 열리는지 (2026-10-28). 확인 뒤 지움
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="ipov jmkang21212-wq@users.noreply.github.com"
          for u in "https://data.sec.gov/submissions/CIK0000320193.json" \
                   "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=424B4&output=atom" \
                   "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR4/"; do
            curl -sS -m 20 -o /tmp/o -w "%{http_code} $u\n" -H "User-Agent: $UA" "$u"; head -c 200 /tmp/o; echo; sleep 1
          done
          curl -sS -m 30 -H "User-Agent: $UA" "https://efts.sec.gov/LATEST/search-index?q=%22initial%20public%20offering%22&forms=424B4&dateRange=custom&startdt=2026-09-01&enddt=2026-10-28" -o /tmp/f.json -w "%{http_code} efts\n"
          jq -r '.hits.total.value as $t | "total \($t)", (.hits.hits[] | ._source | [.file_date, .form, (.display_names|join("; ")), .adsh] | @tsv)' /tmp/f.json | head -60
