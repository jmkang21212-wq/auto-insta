name: publish approved
on:
  schedule:
    - cron: "7,37 23,0-13 * * *"   # 08:07~22:37 KST 30분마다 텔레그램 버튼 응답 확인. 이 저장소에선 예약이 안 돌아서 Claude 예약 작업이 평일 18:43에 한 번 대신 실행
  workflow_dispatch:
    inputs:
      cmd:
        description: "poll(기본) / check / chat-id / list / publish"
        default: "poll"
      rcept_no:
        description: "publish 일 때 접수번호"
        default: ""

concurrency: { group: posts, cancel-in-progress: false }

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # [N번 훅으로] 다시 만들 때 영상 검색
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 다시 만들 때 영상 첫 장면 비전 확인 (없으면 확인 생략)
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # [N번 훅으로] 버튼이 오면 이 실행 안에서 릴스를 다시 만들어야 해서 합성 도구까지 깐다
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: 실행
        run: |
          CMD="${{ github.event.inputs.cmd || 'poll' }}"
          if [ "$CMD" = "publish" ]; then
            python -m gongsi.publish publish --rcept-no "${{ github.event.inputs.rcept_no }}"
          else
            python -m gongsi.publish "$CMD"
          fi
      - name: 상태 커밋
        run: |
          git config user.name "gongsi-bot"
          git config user.email "gongsi-bot@users.noreply.github.com"
          git add posts state
          git diff --cached --quiet || git commit -m "posts: poll $(date '+%F %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
