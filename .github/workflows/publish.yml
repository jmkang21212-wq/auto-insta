name: publish approved
on:
  # 30분 예약 확인은 2026-10-28에 뺐다: 깃허브 예약이 몇 시간씩 늦게 돌면서 같은 줄(posts)에 대기 중이던
  # 아침 생성 실행을 취소시킬 수 있어서. 대신 생성 실행의 감시가 끝날 때 할 일이 남았으면 이 감시 실행을 이어 건다
  workflow_dispatch:
    inputs:
      cmd:
        description: "poll(기본) / watch / check / chat-id / list / publish"
        default: "poll"
      rcept_no:
        description: "publish 일 때 접수번호"
        default: ""
      minutes:
        description: "watch 일 때 승인을 기다릴 시간(분, 최대 330)"
        default: "330"

concurrency: { group: posts, cancel-in-progress: false }

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # watch(승인 대기·시간대 게시)일 때만 길게 돈다. poll은 몇 분
    permissions: { contents: write, actions: write }
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      # FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}   # 2026-10-31 끔: 페이스북 토큰을 쓴 뒤 이틀 연속 Meta 차단. 다시 켜려면 주석 해제 (릴스 음악)
      IG_FB_USER_ID: ${{ secrets.IG_FB_USER_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # 미국 공모주(EDGAR): '이름 연락이메일'
      GITHUB_TOKEN: ${{ github.token }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # [N번 훅으로] 다시 만들 때 영상 검색
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 다시 만들 때 영상 첫 장면 비전 확인 (없으면 확인 생략)
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # [N번 훅으로] 버튼이 오면 이 실행 안에서 릴스를 다시 만들어야 해서 합성 도구까지 깐다
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: 실행
        env: { GIT_SYNC: "1" }   # [N번 훅으로]로 다시 만든 릴스는 바로 푸시해야 인스타가 raw 주소로 가져감
        run: |
          git config user.name "gongsi-bot"
          git config user.email "gongsi-bot@users.noreply.github.com"
          CMD="${{ github.event.inputs.cmd || 'poll' }}"
          if [ "$CMD" = "publish" ]; then
            python -m gongsi.publish publish --rcept-no "${{ github.event.inputs.rcept_no }}"
          elif [ "$CMD" = "watch" ]; then
            python -m gongsi.publish watch --minutes "${{ github.event.inputs.minutes || '330' }}"
          else
            python -m gongsi.publish "$CMD"
          fi
      - name: 상태 커밋
        run: |
          git config user.name "gongsi-bot"
          git config user.email "gongsi-bot@users.noreply.github.com"
          git add posts state
          git diff --cached --quiet || git commit -m "posts: poll $(date '+%F %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
